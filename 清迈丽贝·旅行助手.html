<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --text2:#6e6e73;

*{margin:0;padding:0;box-sizing:border-box;}

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("app-data").textContent);
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
var WEEK = ["日","一","二","三","四","五","六"];

var CAT = {};
DATA.categories.forEach(function(c){ CAT[c.id] = c; });
var ROLE = {};
DATA.roles.forEach(function(r){ ROLE[r.id] = r; });

var state = { module:"overview", dayId:null, mapHidden:false, userCollapsed:false, mapReady:false, provider:"amap" };

/* ---------- 工具 ---------- */
function todayStr(d){
  d = d || new Date();
  var p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function tripState(now){
  var start = new Date(2026,8,24);
  var day1 = new Date(2026,8,25);
  var end = new Date(2026,9,7,23,59,59);
  if (now < start){
    var ms = start - now;
    var days = Math.ceil(ms/86400000);
    var label = days > 1 ? "距出发还有 "+days+" 天" : (days === 1 ? "明天就要出发啦" : "今天出发");
    return { phase:"before", label:label, sub:"出发日 2026/9/24 · 上海 → 昆明（中转过夜）" };
  }
  if (now < day1) return { phase:"eve", label:"出发前夜 · 今晚飞昆明", sub:"明天 9/25 09:15 落地清迈，行程正式开始" };
  if (now <= end){
    var n = Math.floor((now - day1)/86400000) + 1;
    return { phase:"during", day:n, label:"旅行进行中 · 第 "+n+" 天 / 共 13 天", sub:"今天是 "+todayStr(now)+" · 9/25 起算第 1 天" };
  }
  return { phase:"done", label:"旅行结束 🎉", sub:"13 天悠闲之旅完成，整理照片与手信吧" };
}
function renderCountdown(){
  var t = tripState(new Date());
  $("#countdownLabel").textContent = t.label;
  $("#countdownSub").textContent = t.sub;
  var btn = $("#todayBtn");
  if (t.phase === "during"){
    btn.classList.remove("hidden");
    btn.textContent = "查看今天 · 第 "+t.day+" 天 →";
  } else {
    btn.classList.add("hidden");
  }
}

/* ---------- 导航 ---------- */
function navLinks(poi, withResv){
  var q = encodeURIComponent(poi.name_zh || poi.name);
  var links = [
    { label:"高德", href:"https://uri.amap.com/search?keyword="+q },
    { label:"Google", href: poi.mapUrl || ("https://www.google.com/maps/search/?api=1&query="+q) },
    { label:"Apple", href:"http://maps.apple.com/?q="+q }
  ];
  if (withResv && poi.reservation && poi.reservation.required){
    links.push({ label:"🔔 需预约", href:"", cls:"resv" });
  }
  return links.map(function(l){
    var cls = l.cls ? ' class="'+l.cls+'"' : "";
    var href = l.href || "javascript:void(0)";
    return '<a'+cls+' href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>';
  }).join("");
}
function poiCard(poi, opts){
  opts = opts || {};

  google: { name:"Google 地图", subdomains:"0123", maxZoom:20, url:"https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", attribution:"© Google" },
  google_sat: { name:"Google 卫星", subdomains:"0123", maxZoom:20, url:"https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", attribution:"© Google" },
  osm: { name:"OSM", subdomains:"", maxZoom:19, url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", attribution:"© OpenStreetMap" }

var tileLayer = null;
function providerKey(){
  try { var k = localStorage.getItem("tripMapProvider"); if (TILE_PROVIDERS[k]) return k; } catch(e){}
  return "amap";
}

function setTileProvider(key){
  if (!TILE_PROVIDERS[key]) return;
  state.provider = key;
  if (!map) return;
  if (tileLayer) map.removeLayer(tileLayer);
  var p = TILE_PROVIDERS[key];
  tileLayer = L.tileLayer(p.url, { subdomains: p.subdomains || "abc", maxZoom: p.maxZoom || 19, attribution: p.attribution }).addTo(map);
  $$("#mapTools .mchip").forEach(function(c){ c.classList.toggle("active", c.dataset.key === key); });
  try { localStorage.setItem("tripMapProvider", key); } catch(e){}
}

/* ---------- 地图 ---------- */
var map = null, layer = null;
function ensureMap(){
  if (map) return;
  map = L.map("map", { zoomControl: true });
  state.provider = providerKey();
  renderMapTools();
  setTileProvider(state.provider);
  map.setView([18.80, 98.97], 12);
  layer = L.layerGroup().addTo(map);
  state.mapReady = true;
}
function haversineKm(a, b){
  var R = 6371, d2r = Math.PI/180;
  var dLat = (b[0]-a[0])*d2r, dLng = (b[1]-a[1])*d2r;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a[0]*d2r)*Math.cos(b[0]*d2r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function renderMapDay(day){
  if (!map || !day) return;
  layer.clearLayers();
  var pts = [];
  day.stops.forEach(function(st, idx){
    var poi = st.poi;
    if (!poi || !poi.coords) return;
    var meta = ROLE[st.role] || CAT[poi.category] || { icon:"📍", color:"#8e8e93", label:"" };
    var n = idx + 1;
    var label = poi.name_zh || poi.name;
    var icon = L.divIcon({
      className: "", iconSize: [0,0], iconAnchor: [13, 26], popupAnchor: [0, -34],
      html: '<div class="pin-w"><div class="pin" style="--c:'+meta.color+'"><span>'+n+'</span></div>' +
            '<div class="pin-label">'+esc(label)+'</div></div>'
    });
    L.marker(poi.coords, { icon: icon })
      .addTo(layer)
      .bindPopup('<b>'+n+'. '+esc(label)+'</b><br>'+(st.time?esc(st.time)+' ':"")+esc(meta.label||""));
    pts.push({ c: poi.coords, n: n });
  });
  if (!pts.length) return;
  // 顺序连线：跳过跨城长距离段（如航班），避免一条直线跨过全国
  for (var i = 1; i < pts.length; i++){
    if (haversineKm(pts[i-1].c, pts[i].c) <= 60){
      L.polyline([pts[i-1].c, pts[i].c], { color: day.color, weight: 3, opacity: .85, dashArray: "6 8" }).addTo(layer);
    }
  }
  // 聚焦当日主要活动区：有跨城长段时聚焦最大连续簇
  var clusters = [], cur = [pts[0]];
  for (var j = 1; j < pts.length; j++){
    if (haversineKm(cur[cur.length-1].c, pts[j].c) > 60){ clusters.push(cur); cur = [pts[j]]; }
    else cur.push(pts[j]);
  }
  clusters.push(cur);
  var best = clusters[0];
  for (var k = 1; k < clusters.length; k++){ if (clusters[k].length > best.length) best = clusters[k]; }
  var view = best.map(function(p){ return p.c; });
  if (view.length > 1){ map.fitBounds(L.latLngBounds(view).pad(0.28)); }
  else if (view.length === 1){ map.setView(view[0], 14); }
  setTimeout(function(){ map.invalidateSize(); }, 60);
}

function setMapHidden(hidden){
  state.mapHidden = hidden;
  document.body.classList.toggle("map-hidden", hidden);
  $("#mapToggle").textContent = hidden ? "展开地图 ▴" : "收起地图 ▾";
  $("#mapShowBtn").classList.toggle("visible", hidden && state.module === "detail");
  if (!hidden && map) setTimeout(function(){ map.invalidateSize(); }, 80);
}
function setModule(m){
  state.module = m;
  $$(".module-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.module === m); });
  $("#module-overview").classList.toggle("hidden", m !== "overview");
  $("#module-detail").classList.toggle("hidden", m !== "detail");
  $("#module-expenses").classList.toggle("hidden", m !== "expenses");
  if (m === "overview"){
    renderOverview();
    setMapHidden(true);
  } else if (m === "expenses"){
    setMapHidden(true);
  } else {
    ensureMap();
    setMapHidden(state.userCollapsed);
    if (state.dayId){ var d = DATA.days.filter(function(x){ return x.id === state.dayId; })[0]; if (d) renderMapDay(d); }
    if (map) setTimeout(function(){ map.invalidateSize(); }, 60);
  }
}

      if (d && typeof d.rate === "number" && d.rate > 0){ EXP.rate = d.rate; }
    }
  } catch(e){}

function expToCNY(it){ return it.currency === "THB" ? it.amount / EXP.rate : it.amount; }
function expFmt(n){ return "¥" + (Math.round(n*100)/100).toLocaleString("zh-CN"); }
function expCat(id){ for (var i=0;i<EXP_CATS.length;i++){ if (EXP_CATS[i].id === id) return EXP_CATS[i]; } return EXP_CATS[EXP_CATS.length-1]; }
function expDayLabel(dayId){ for (var i=0;i<DATA.days.length;i++){ if (DATA.days[i].id === dayId) return DATA.days[i]; } return null; }
function expFind(id){ for (var i=0;i<EXP.items.length;i++){ if (EXP.items[i].id === id) return EXP.items[i]; } return null; }
function expPoiName(poiId){
  for (var i=0;i<DATA.days.length;i++){ var dd = DATA.days[i];
    for (var j=0;j<dd.stops.length;j++){ if (dd.stops[j].poiId === poiId){ return dd.stops[j].poi.name_zh || dd.stops[j].poi.name; } }
  }
  return "";
}
function toast(msg){
  var el = document.getElementById("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}
function expCurOpts(sel){
  return '<option value="CNY"'+(sel==="CNY"?' selected':'')+'>¥ 人民币</option><option value="THB"'+(sel==="THB"?' selected':'')+'>฿ 泰铢</option>';
}
function expCatChipsHtml(sel){
  return EXP_CATS.map(function(c){ return '<button type="button" class="mchip2" data-cat="'+c.id+'"'+(c.id===sel?' style="background:var(--accent);border-color:var(--accent);color:#fff"':'')+'>'+c.icon+' '+c.name+'</button>'; }).join("");
}
function expRowHtml(it){

  else if (day){ badge = '<span class="badge note">'+esc(day.label)+' · '+esc(day.title)+'</span>'; }
  var typeTag = it.type === "shared"
    ? '<span class="badge booked">👥 公共</span>'
    : '<span class="badge todo">👤 '+esc(it.person||"")+'</span>';
  var orig = (it.currency === "THB" ? "฿" : "¥") + (Math.round(it.amount*100)/100);
  var dateTag = it.date ? '<span class="rd">'+esc(it.date)+'</span>' : "";
  var head = '<div class="ei-ic">'+cat.icon+'</div>' +
    '<div class="ei-body">' +
      '<div class="ei-t">'+esc(it.name)+' '+typeTag+' '+badge+'</div>' +
      '<div class="ei-s">'+cat.name+' · '+orig+' · 折合 '+expFmt(expToCNY(it))+' '+dateTag+'</div>' +

      '<button class="btn mini" data-act="edit">编辑</button>' +

    edit = '<div class="exp-inline">' +
      '<div class="f-row"><input type="text" id="eiName" value="'+esc(it.name)+'" placeholder="项目名称" maxlength="40">' +

        '<select id="eiCurrency">' + expCurOpts(it.currency) + '</select>' +

function saveExpense(){
  var name = ($("#expName").value||"").trim();
  var amount = parseFloat($("#expAmount").value);
  var currency = $("#expCurrency").value;
  var date = $("#expDate").value || "";
  var catEl = $("#expCatChips .mchip2.active");
  var category = catEl ? catEl.dataset.cat : "other";
  var typeEl = $("#module-expenses .exp-type.active");
  var type = typeEl ? typeEl.dataset.type : "shared";
  var person = type === "personal" ? ($("#expPerson").value||"").trim() : "";
  var dayId = $("#expDay").value || null;
  var poiId = $("#expPoi").value || null;
  if (!name){ toast("请填写项目名称"); return; }
  if (!(amount > 0)){ toast("金额需大于 0"); return; }
  if (type === "personal" && !person){ toast("个人花销必须填写人员名称"); return; }
  EXP.items.push({ id:"e"+Date.now()+"-"+Math.floor(Math.random()*1e6), name:name, amount:amount, currency:currency, date:date, category:category, type:type, person:person, dayId:dayId, poiId:poiId, createdAt:Date.now() });
  saveExpenses();
  toast("已添加");
  renderExpenses();
}
function saveInlineEdit(id){
  var it = expFind(id); if (!it) return;
  var name = ($("#eiName").value||"").trim();
  var amount = parseFloat($("#eiAmount").value);
  var currency = $("#eiCurrency").value;
  var date = $("#eiDate").value || "";
  var catEl = $("#eiCatChips .mchip2.active");
  var category = catEl ? catEl.dataset.cat : it.category;
  var typeEl = $("#module-expenses .ei-type.active");
  var type = typeEl ? typeEl.dataset.type : it.type;
  var person = type === "personal" ? ($("#eiPerson").value||"").trim() : "";
  if (!name){ toast("请填写项目名称"); return; }

  it.name=name; it.amount=amount; it.currency=currency; it.date=date; it.category=category; it.type=type; it.person=person;

function bindExpForm(){
  var f = $("#module-expenses");
  var catChips = $$("#expCatChips .mchip2");
  catChips.forEach(function(c){ c.addEventListener("click", function(){
    catChips.forEach(function(x){ x.classList.remove("active"); }); c.classList.add("active");
  }); });
  var typeChips = $$(".exp-type");
  typeChips.forEach(function(c){ c.addEventListener("click", function(){
    typeChips.forEach(function(x){ x.classList.remove("active"); }); c.classList.add("active");
    var row = $("#expPersonRow"); if (row) row.style.display = c.dataset.type === "personal" ? "flex" : "none";
  }); });
  $$(".exp-person").forEach(function(c){ c.addEventListener("click", function(){ $("#expPerson").value = c.dataset.p; }); });
  var daySel = $("#expDay");
  if (daySel) daySel.addEventListener("change", function(){
    var sel = $("#expPoi"); var dayId = this.value; sel.disabled = !dayId;
    if (!dayId){ sel.innerHTML = '<option value="">选择当天地点…</option>'; return; }
    var day = expDayLabel(dayId); if (!day) return;
    var opts = ['<option value="">（仅关联到当天）</option>'];
    day.stops.forEach(function(st){ var poi = st.poi; if (poi) opts.push('<option value="'+poi.id+'">'+esc(poi.name_zh||poi.name)+'</option>'); });
    sel.innerHTML = opts.join("");
  });
  var saveBtn = $("#expSave");
  if (saveBtn) saveBtn.addEventListener("click", saveExpense);
  var rateEl = $("#expRate");
  if (rateEl) rateEl.addEventListener("change", function(){
    var v = parseFloat(this.value);
    if (v > 0){ EXP.rate = v; saveExpenses(); renderExpenses(); }
  });
  var fx = $("#fxAmount");
  if (fx) fx.addEventListener("input", updateFx);
  var fxFrom = $("#fxFrom");
  if (fxFrom) fxFrom.addEventListener("change", updateFx);
  function updateFx(){
    var a = parseFloat(($("#fxAmount").value) || "0");
    var from = $("#fxFrom").value;
    var resEl = $("#fxResult"); if (!resEl) return;
    if (from === "CNY"){ resEl.textContent = "≈ ฿" + (Math.round(a * EXP.rate * 100) / 100); }
    else { resEl.textContent = "≈ ¥" + (Math.round(a / EXP.rate * 100) / 100); }
  }
  var fltEls = $$("#expFilter .mchip2");
  fltEls.forEach(function(c){ c.addEventListener("click", function(){
    fltEls.forEach(function(x){ x.classList.remove("active"); }); c.classList.add("active");
    EXP_FILTER = c.dataset.filter; renderExpenses();
  }); });
}
function renderExpenses(){
  var shared = 0, personal = 0;
  EXP.items.forEach(function(it){ var v = expToCNY(it); if (it.type === "shared") shared += v; else personal += v; });
  var perMember = DATA.members.map(function(m){
    var p = 0;
    EXP.items.forEach(function(it){ if (it.type === "personal" && (it.person||"").trim() === m) p += expToCNY(it); });
    return { name: m, total: p + shared / Math.max(1, DATA.members.length), own: p };
  });
  var visible = EXP.items.slice().sort(function(a,b){
    var da = a.date || "", db = b.date || "";
    if (da !== db) return da < db ? 1 : -1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  if (EXP_FILTER === "shared") visible = visible.filter(function(it){ return it.type === "shared"; });
  if (EXP_FILTER === "personal") visible = visible.filter(function(it){ return it.type === "personal"; });
  var sharePer = shared / Math.max(1, DATA.members.length);
  var html = "";
  html += '<div class="card"><h2><span class="ic">💰</span>花费统计</h2>' +
    '<div class="exp-sum-grid cols2">' +
      '<div class="exp-sum"><div class="k">👥 公共花销</div><div class="v">'+expFmt(shared)+'</div></div>' +
      '<div class="exp-sum total"><div class="k">💰 总合计</div><div class="v">'+expFmt(shared+personal)+'</div></div>' +
    '</div>' +
    '<div class="exp-per">' + perMember.map(function(m){
      return '<div class="exp-per-item"><span class="n">'+esc(m.name)+'</span><b>'+expFmt(m.total)+'</b><span class="s">个人 '+expFmt(m.own)+' + 公共均摊 '+expFmt(sharePer)+'</span></div>';
    }).join("") + '</div>' +
  '</div>';
  html += '<div class="card"><h2><span class="ic">🧮</span>汇率计算</h2>' +
    '<div class="f-row"><span class="f-lbl">汇率</span><input type="number" id="expRate" min="0.1" step="0.1" value="'+EXP.rate+'" style="width:80px"><span class="hint">1 ¥ = ? ฿（改后自动保存）</span></div>' +
    '<div class="f-row"><span class="f-lbl">金额</span><input type="number" id="fxAmount" placeholder="输入金额" step="0.01" style="width:120px">' +
      '<select id="fxFrom"><option value="CNY">¥ 人民币</option><option value="THB">฿ 泰铢</option></select>' +
      '<span class="fx-arrow">→</span><b id="fxResult" class="fx-result">—</b></div>' +
  '</div>';
  html += '<div class="card"><h2><span class="ic">➕</span>新增花销</h2>' +
    '<div class="exp-form">' +
      '<div class="f-row"><input type="text" id="expName" placeholder="项目名称（如：泰餐课 Mama Noi）" maxlength="40"></div>' +
      '<div class="f-row">' +
        '<input type="number" id="expAmount" placeholder="金额" min="0" step="0.01">' +
        '<select id="expCurrency"><option value="CNY">¥ 人民币</option><option value="THB">฿ 泰铢</option></select>' +
        '<input type="date" id="expDate">' +
      '</div>' +
      '<div class="f-row"><span class="f-lbl">分类</span><div class="chips" id="expCatChips">' +
        EXP_CATS.map(function(c){ return '<button type="button" class="mchip2" data-cat="'+c.id+'">'+c.icon+' '+c.name+'</button>'; }).join("") +
      '</div></div>' +
      '<div class="f-row"><span class="f-lbl">类型</span><div class="chips">' +
        '<button type="button" class="mchip2 exp-type active" data-type="shared">👥 公共花销</button>' +
        '<button type="button" class="mchip2 exp-type" data-type="personal">👤 个人花销</button>' +
      '</div></div>' +
      '<div class="f-row" id="expPersonRow" style="display:none"><span class="f-lbl">人员（必填）</span>' +
        '<input type="text" id="expPerson" placeholder="输入或选择人员" maxlength="20" list="expMemberList">' +
        '<datalist id="expMemberList">'+DATA.members.map(function(m){ return '<option value="'+esc(m)+'">'; }).join("")+'</datalist>' +
        '<div class="chips">'+DATA.members.map(function(m){ return '<button type="button" class="mchip2 exp-person" data-p="'+esc(m)+'">'+esc(m)+'</button>'; }).join("")+'</div>' +
      '</div>' +
      '<div class="f-row"><span class="f-lbl">关联行程</span>' +
        '<select id="expDay"><option value="">不关联</option>'+DATA.days.map(function(d){ return '<option value="'+d.id+'">'+d.label+' · '+esc(d.title)+'</option>'; }).join("")+'</select>' +
        '<select id="expPoi" disabled><option value="">选择当天地点…</option></select>' +
      '</div>' +
      '<div class="f-row"><button class="btn primary" id="expSave">添加花销</button></div>' +
    '</div></div>';
  html += '<div class="card"><h2><span class="ic">📋</span>花销明细</h2>' +
    '<div class="chips" id="expFilter">' +
      '<button type="button" class="mchip2 active" data-filter="all">全部</button>' +
      '<button type="button" class="mchip2" data-filter="shared">👥 公共</button>' +
      '<button type="button" class="mchip2" data-filter="personal">👤 个人</button>' +
    '</div>' +
    (visible.length ? '<div class="exp-list">' + visible.map(expRowHtml).join("") + '</div>' : '<div class="empty">还没有花销记录，先在上面添加一笔吧～</div>') +
  '</div>';
  $("#module-expenses").innerHTML = html;
  var fc = $("#expCatChips .mchip2"); if (fc) fc.classList.add("active");
  var dt = $("#expDate"); if (dt && !dt.value) dt.value = todayStr();

function nearbyHtml(day){
  var hotel = null;
  day.stops.forEach(function(st){ if (st.order === 0 && st.poi && st.poi.category === "hotel") hotel = st.poi; });
  if (!hotel) return "";
  var used = {}; day.stops.forEach(function(st){ used[st.poiId] = true; });
  var groups = {};
  Object.keys(POI_MAP).forEach(function(id){
    var p = POI_MAP[id];
    if (!p || used[p.id] || p.id === hotel.id || !(p.rating >= 4.4) || !p.coords) return;
    var km = haversineKm(hotel.coords, p.coords);
    if (km > 6) return;
    var cat = CAT[p.category] || { label:"其他", icon:"📍" };
    var key = cat.label || "其他";
    (groups[key] = groups[key] || []).push({ p: p, km: km });
  });
  var keys = Object.keys(groups);
  if (!keys.length) return "";
  var html = '<div class="section-title">🏨 今日酒店附近 · 高分推荐（<6km）</div>';
  keys.forEach(function(k){
    groups[k].sort(function(a, b){ return (b.p.rating || 0) - (a.p.rating || 0); });
    var items = groups[k].slice(0, 4).map(function(o){
      return '<div class="picker-row"><span class="pic">'+(CAT[o.p.category]||{icon:"📍"}).icon+'</span><span class="pn">'+esc(o.p.name_zh||o.p.name)+'</span><span class="pc">★'+(o.p.rating||"")+' · '+o.km.toFixed(1)+'km</span><button class="btn mini primary picker-add" data-poi="'+o.p.id+'">加入</button></div>';
    }).join("");
    html += '<div class="rec-group"><div class="rec-label">'+esc(k)+'</div>' + items + '</div>';
  });
  return html;
}

  var el = document.getElementById("aList");

  }).join("");
}
function addAmapPlace(name, loc, addr){
  var parts = String(loc||"").split(",");
  var lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
  if (!(lng && lat)){ toast("该地点缺少坐标"); return; }
  var pid = "a-" + Math.random().toString(36).slice(2, 10);
  POI_MAP[pid] = {
    id: pid, name: name, name_zh: name, city: "Chiang Mai", area: addr, category: "spot",
    coords: [lat, lng], note: addr || "", tip: "", rating: undefined, hours: "",
    mapUrl: "https://uri.amap.com/marker?position=" + lng + "," + lat + "&name=" + encodeURIComponent(name),
    contentTier: "compact", sourceIds: [], themeTags: ["amap"]
  };
  var dsel = document.getElementById("addDay"); var nsel = document.getElementById("addNote");
  addStopToDay(pid, dsel ? dsel.value : null, "", "landmark", nsel ? nsel.value.trim() : "");
}
function renderOList(data){
  var el = document.getElementById("oList");
  if (!el) return;
  var feats = data && data.features ? data.features : [];
  if (!feats.length){ el.innerHTML = '<div class="empty">没有匹配结果</div>'; return; }

    var p = f.properties || {}; var g = f.geometry || {};
    var coords = g.coordinates || [];
    var nm = p.name || "";
    var addr = [p.street || "", p.city || "", p.country || ""].filter(Boolean).join("，");
    return '<div class="picker-row"><span class="pic">📍</span><span class="pn">'+esc(nm)+'</span><span class="pc">'+esc(addr)+'</span>' +
      '<button class="btn mini primary o-add" data-oname="'+esc(nm)+'" data-olng="'+esc(coords[0]||"")+'" data-olat="'+esc(coords[1]||"")+'" data-oaddr="'+esc(addr)+'">加入</button></div>';
  }).join("");
}

function buildPoiMap(){
  POI_MAP = {};
  DATA.days.forEach(function(d){
    d.stops.forEach(function(st){ if (st.poi) POI_MAP[st.poiId] = st.poi; });
    (d.candidates||[]).forEach(function(p){ if (p) POI_MAP[p.id] = p; });
  });
}
function cloneDay(d){

var SYNC = { room:"", localUpdatedAt:0, lastSyncAt:0, status:"off", panel:false, _t:null };
var SEEDING = false;
var SYNC_DB = "https://qingmai-lipe-2026-default-rtdb.firebaseio.com";
function loadSyncMeta(){
  try { var m = JSON.parse(localStorage.getItem("tripSyncMeta") || "{}");
    if (m && typeof m === "object"){ SYNC.room = m.room || ""; SYNC.localUpdatedAt = m.localUpdatedAt || 0; SYNC.lastSyncAt = m.lastSyncAt || 0; }
  } catch(e){}
}
function saveSyncMeta(){ try { localStorage.setItem("tripSyncMeta", JSON.stringify({ room:SYNC.room, localUpdatedAt:SYNC.localUpdatedAt, lastSyncAt:SYNC.lastSyncAt })); } catch(e){} }
function markDirty(){ SYNC.localUpdatedAt = Date.now(); saveSyncMeta(); if (SYNC.room){ if (SYNC._t) clearTimeout(SYNC._t); SYNC._t = setTimeout(doSync, 1500); } }
function syncUrl(){ return SYNC_DB + "/rooms/" + encodeURIComponent(SYNC.room) + "/data.json"; }
function setSyncStatus(st){ SYNC.status = st; renderSyncStatus(); }
function renderSyncStatus(){
  var b = document.getElementById("syncBtn");
  if (b){ var dot = b.querySelector(".dot"); if (dot) dot.className = "dot " + SYNC.status; }
  var p = document.getElementById("syncStatus");
  if (p){
    var map = { "off":"尚未连接云端", "no-room":"未设置房间号", "syncing":"正在同步…", "ok":"已连接 · 上次同步 " + (SYNC.lastSyncAt ? new Date(SYNC.lastSyncAt).toLocaleTimeString("zh-CN", { hour:"2-digit", minute:"2-digit" }) : "—"), "error":"同步失败（请检查网络/规则）" };
    p.textContent = map[SYNC.status] || "—";
  }
}
var DOT = String.fromCharCode(46); var TIL = String.fromCharCode(126); function encodeListKeys(o){ var r = {}; Object.keys(o || {}).forEach(function(k){ r[k.split(DOT).join(TIL)] = o[k]; }); return r; }
function decodeListKeys(o){ var r = {}; Object.keys(o || {}).forEach(function(k){ r[k.split(TIL).join(DOT)] = o[k]; }); return r; }
function buildLocalBlob(){
  var ov = loadOverrides();
  var expRaw = {};
  try { expRaw = JSON.parse(localStorage.getItem("tripExpenses") || "{}"); } catch(e){}
  return { v:1, updatedAt: Math.max(SYNC.localUpdatedAt, Date.now()), overrides:{ days: ov.days }, lists: encodeListKeys(LIST_OV), expenses: expRaw };
}
function pushLocal(){
  var blob = buildLocalBlob();
  SYNC.localUpdatedAt = blob.updatedAt; saveSyncMeta();
  return fetch(syncUrl(), { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(blob) })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); SYNC.lastSyncAt = Date.now(); saveSyncMeta(); setSyncStatus("ok"); renderSyncPanel(); })
    .catch(function(){ setSyncStatus("error"); });
}
function applyRemoteBlob(blob){
  if (!blob) return;
  if (blob.overrides && blob.overrides.days){ localStorage.setItem("tripOverrides", JSON.stringify({ days: blob.overrides.days, history: {} })); }
  if (blob.lists){ localStorage.setItem("tripListOverrides", JSON.stringify(decodeListKeys(blob.lists))); }
  if (blob.expenses){ localStorage.setItem("tripExpenses", JSON.stringify(blob.expenses)); }
  EXP = { items: [], rate: 5 }; loadExpenses();
  LIST_OV = loadListOverrides();
  applyOverrides();
  renderExpenses(); renderOverview(); renderDayTabs();
  var day = currentDay(); if (day){ renderDay(day); renderMapDay(day); }
  toast("已同步云端数据");
}
function doSync(){
  if (!SYNC.room){ setSyncStatus("no-room"); return; }
  if (SYNC.status === "syncing") return;
  setSyncStatus("syncing");
  fetch(syncUrl()).then(function(r){ return r.json(); }).then(function(remote){
    if (remote == null){ return pushLocal(); }
    var rUpd = remote.updatedAt || 0;
    if (SYNC.localUpdatedAt > rUpd){ return pushLocal(); }
    if (rUpd > SYNC.localUpdatedAt){ applyRemoteBlob(remote); SYNC.localUpdatedAt = rUpd; }
    SYNC.lastSyncAt = Date.now(); saveSyncMeta(); setSyncStatus("ok"); renderSyncPanel();

  if (pa){ var dsel = document.getElementById("addDay"); var nsel = document.getElementById("addNote"); addStopToDay(pa.dataset.poi, dsel ? dsel.value : null, "", "landmark", nsel ? nsel.value.trim() : ""); return; }
  var sv = e.target.closest("#editSave");
  if (sv && EDIT_TARGET != null){ applyStopEdit(EDIT_TARGET); return; }
  var cc = e.target.closest("#editCancel");
  if (cc){ EDIT_TARGET = null; refreshAfterEdit(); return; }
  if (EDIT_MODE){
    var item = e.target.closest(".tl-item");
    if (item){
      var idx = parseInt(item.dataset.idx, 10);
      var b2 = e.target.closest("[data-edit]");
      if (b2){
        var act = b2.dataset.edit;
        if (act === "up") moveStop(idx, -1);
        else if (act === "down") moveStop(idx, 1);
        else if (act === "del") removeStopFromDay(idx);
        else if (act === "time"){ EDIT_TARGET = (EDIT_TARGET === idx ? null : idx); refreshAfterEdit(); }
        return;
      }
    }
  }
});
$("#dayPanel").addEventListener("input", function(e){
  var id = e.target && e.target.id;
  if (id === "addSearch"){
    var list = document.getElementById("addSearchList");
    if (list) list.innerHTML = pickerListHtml(e.target.value);
    return;
  }
  if (id === "aSearch"){
    var q1 = e.target.value.trim();
    var al = document.getElementById("aList");
    if (!q1){ if (al) al.innerHTML = ""; return; }
    clearTimeout(e.target._t);
    e.target._t = setTimeout(function(){
      if (!AMAP_WEB_KEY){ if (al) al.innerHTML = '<div class="empty">未配置高德 Key</div>'; return; }
      fetch("https://restapi.amap.com/v3/assistant/inputtips?keywords=" + encodeURIComponent(q1) + "&key=" + AMAP_WEB_KEY + "&datatype=poi").then(function(r){ return r.json(); }).then(renderAList);
    }, 500);
    return;
  }
  if (id === "oSearch"){
    var q2 = e.target.value.trim();
    var ol = document.getElementById("oList");
    if (!q2){ if (ol) ol.innerHTML = ""; return; }
    clearTimeout(e.target._t);
    e.target._t = setTimeout(function(){
      fetch("https://photon.komoot.io/api/?q=" + encodeURIComponent(q2) + "&limit=10").then(function(r){ return r.json(); }).then(renderOList);
    }, 500);
  }
});
$("#module-overview").addEventListener("click", function(e){
  var g = e.target.closest("[data-goto]");
  if (g){ var el = document.getElementById(g.dataset.goto); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  var tg = e.target.closest("[data-cardtoggle]");
  if (tg){ EDIT_CARD = (EDIT_CARD === tg.dataset.cardtoggle ? null : tg.dataset.cardtoggle); renderOverview(); return; }
  var u = e.target.closest("[data-cardundo]");
  if (u){ undoListCard(u.dataset.cardundo); return; }
  var rs = e.target.closest("[data-cardreset]");
  if (rs){ resetListCard(rs.dataset.cardreset); return; }
  var tb = e.target.closest(".todo-box");
  if (tb){ var key = tb.dataset.list; var idx = parseInt(tb.dataset.idx, 10); var arr = getList(key).slice(); var it = arr[idx]; if (typeof it === "string") it = { t: it, done: false }; it.done = !it.done; arr[idx] = it; setList(key, arr); renderOverview(); return; }
  var del = e.target.closest(".li-del");
  if (del){ var key2 = del.dataset.list; var idx2 = parseInt(del.dataset.idx, 10); pushListUndo(key2); var arr2 = getList(key2).slice(); arr2.splice(idx2, 1); setList(key2, arr2); renderOverview(); return; }
  var add = e.target.closest("[data-addbtn]");
  if (add){ var key3 = add.dataset.addbtn; var inp = add.closest(".li-add").querySelector("input"); var v = (inp.value||"").trim(); if (v){ pushListUndo(key3); var arr3 = getList(key3).slice(); arr3.push(v); setList(key3, arr3); renderOverview(); } return; }
});
$("#module-overview").addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.dataset && e.target.dataset.addlist){
    var key = e.target.dataset.addlist; var v = (e.target.value||"").trim();
    if (v){ pushListUndo(key); var arr = getList(key).slice(); arr.push(v); setList(key, arr); renderOverview(); }
  }
});
$("#dayTabs").addEventListener("click", function(e){
  var t = e.target.closest(".day-tab");
  if (t) selectDay(t.dataset.id, true);
});
window.addEventListener("resize", function(){
  if (map) setTimeout(function(){ map.invalidateSize(); }, 120);
});

seedExpensesIfEmpty();
loadExpenses();
renderExpenses();
renderOverview();
renderDayTabs();

var t = tripState(new Date());
if (t.phase === "during"){
  var today = DATA.days.filter(function(d){ return d.date === todayStr(); })[0];
  if (today) initial = today.id;
}
if (!initial) initial = DATA.days[1] ? DATA.days[1].id : DATA.days[0].id;
selectDay(initial, false);
setModule("overview");
setInterval(renderCountdown, 60000);
renderSyncStatus();
if (SYNC.room){ setTimeout(doSync, 800); }
setInterval(doSync, 20000);
window.addEventListener("focus", function(){ doSync(); });
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") doSync(); });
})();
