<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>清迈 + 丽贝岛 · 13 天旅行助手（2026 中秋国庆）</title>
<meta name="description" content="总览 + 计划详情 · 兴趣班/市集/吃喝为主的清迈 8 天与丽贝岛慢节奏 · 3 人 · 已订机票酒店">
<style id="leaflet-css">__LEAFLET_CSS__</style>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --text2:#6e6e73;
  --line:rgba(60,60,67,.12); --accent:#0a84ff; --amber:#ff9f0a; --green:#34c759; --red:#ff3b30;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --radius:14px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ── 顶栏 ── */
.app-header{
  position:sticky;top:0;z-index:200;background:rgba(245,245,247,.92);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line);padding:calc(6px + var(--safe-top)) 14px 8px;
}
.brand{display:flex;align-items:center;gap:8px;}
.brand .logo{font-size:22px;}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.02em;}
.brand .sub{font-size:12px;color:var(--text2);}
.module-nav{display:flex;gap:8px;margin-top:8px;}
.module-btn{
  flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text2);
  font-size:14px;font-weight:600;transition:.15s;
}
.module-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── 布局 ── */
.layout{display:flex;flex-direction:column;min-height:calc(100vh - 100px);}
.map-panel{position:relative;background:#e9edf1;border-bottom:.5px solid var(--line);display:flex;flex-direction:column;}
.map-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 12px;background:#fff;border-bottom:.5px solid var(--line);
}
.map-bar .ttl{font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;}
.map-toggle{
  border:1px solid var(--line);background:#fff;border-radius:980px;padding:5px 12px;
  font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;
}
.map-tools{display:flex;gap:6px;padding:6px 12px;background:#fff;border-bottom:.5px solid var(--line);flex-wrap:wrap;}
.mchip{border:1px solid var(--line);background:#fff;border-radius:980px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--text2);transition:.15s;}
.mchip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#map{width:100%;height:34vh;min-height:240px;z-index:1;}
.content{flex:1;padding:14px 14px calc(24px + var(--safe-bottom));width:100%;}

@media (min-width:900px){
  .layout{flex-direction:row;align-items:stretch;}
  .map-panel{width:46%;position:sticky;top:0;height:100vh;border-bottom:none;border-right:.5px solid var(--line);}
  #map{height:auto;flex:1;min-height:0;}
  .content{width:54%;max-width:860px;padding:20px 24px calc(32px + var(--safe-bottom));}
}
body.map-hidden .map-panel{display:none;}
body.map-hidden .content{width:100%;max-width:none;}

#mapShowBtn{
  position:fixed;right:14px;bottom:calc(18px + var(--safe-bottom));z-index:300;
  display:none;align-items:center;gap:6px;border:none;border-radius:980px;background:var(--accent);color:#fff;
  padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(10,132,255,.35);
}
#mapShowBtn.visible{display:flex;}

/* ── 卡片 ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h2 .ic{font-size:17px;}
.section-desc{font-size:12px;color:var(--text2);margin:-6px 0 10px;}

/* hero */
.hero{
  background:linear-gradient(135deg,#0a84ff 0%,#5ac8fa 100%);color:#fff;border-radius:18px;
  padding:20px 18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(10,132,255,.25);
}
.hero .kick{font-size:13px;opacity:.9;}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.2;}
.hero .mid{font-size:13px;opacity:.92;}
.hero .cta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.hero .cta button{
  border:none;border-radius:980px;background:rgba(255,255,255,.22);color:#fff;padding:7px 14px;font-size:13px;font-weight:600;
  backdrop-filter:blur(8px);
}
.hero .cta button.primary{background:#fff;color:var(--accent);}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:980px;
  background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;
}
.chip.avatar{background:#eef4ff;border-color:#cfe0ff;color:#0a60c4;}
.chip .dot{width:8px;height:8px;border-radius:50%;}

/* prep grid */
.prep-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:640px){.prep-grid{grid-template-columns:repeat(3,1fr);}}
.prep-col{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px;}
.prep-col h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.prep-col ul{list-style:none;}
.prep-col li{font-size:12.5px;color:var(--text);padding:3px 0 3px 16px;position:relative;}
.prep-col li::before{content:"•";position:absolute;left:2px;color:var(--accent);}
.prep-col li.todo::before{content:"☐";left:0;color:var(--amber);}
.prep-col li.done::before{content:"☑";left:0;color:var(--green);}

/* list rows */
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .ric{width:34px;height:34px;border-radius:10px;background:#f0f0f3;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.row .rbody{flex:1;min-width:0;}
.row .rt{font-size:14px;font-weight:600;}
.row .rd{font-size:12.5px;color:var(--text2);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:980px;margin-left:6px;}
.badge.booked{background:#e6f8ec;color:#1f9d55;}
.badge.todo{background:#fff4e0;color:#c77700;}
.badge.note{background:#eef2f7;color:#5a6472;}

/* must buy */
.buy-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:640px){.buy-grid{grid-template-columns:1fr 1fr;}}
.buy-col{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px;}
.buy-col h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.buy-col ul{list-style:none;columns:2;column-gap:14px;}
.buy-col li{font-size:12.5px;padding:2px 0;break-inside:avoid;}
.buy-col li::before{content:"✓ ";color:var(--green);font-weight:700;}

/* route cards */
.route-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:560px){.route-grid{grid-template-columns:1fr 1fr;}}
@media (min-width:1100px){.route-grid{grid-template-columns:1fr 1fr 1fr;}}
.route-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;
  transition:.15s;text-align:left;width:100%;
}
.route-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.route-card .rd{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.route-card .dnum{font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:3px 8px;}
.route-card .ddate{font-size:12px;color:var(--text2);font-weight:600;}
.route-card .rtitle{font-size:14px;font-weight:700;line-height:1.3;}
.route-card .rsum{font-size:12px;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── 计划详情 ── */
.day-tabs{
  display:flex;gap:6px;padding:2px 0 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex-shrink:0;padding:7px 12px;border-radius:980px;border:1px solid var(--line);background:#fff;
  color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;
}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.day-tab .w{font-weight:500;opacity:.75;}

.day-head{margin-bottom:10px;}
.day-head .dline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.day-head .dnum{font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:3px 9px;}
.day-head h2{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.day-head .city{font-size:12px;font-weight:600;color:var(--text2);}
.day-head .summary{font-size:13px;color:var(--text2);margin-top:5px;}

/* reminders */
.reminder-bar{
  background:#fff7e8;border:1px solid #ffd9a0;border-radius:12px;padding:11px 13px;margin-bottom:14px;
}
.reminder-bar .rt{font-size:13px;font-weight:700;color:#b35c00;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.reminder-item{display:flex;gap:8px;font-size:12.5px;padding:4px 0;color:#6b4a10;}
.reminder-item .lbl{font-weight:700;color:#8a5a00;}
.reminder-item .due{margin-left:auto;white-space:nowrap;color:#b35c00;font-weight:600;}

/* timeline */
.timeline{position:relative;margin:6px 0 4px;padding-left:0;}
.tl-item{display:flex;gap:12px;padding:8px 0;position:relative;}
.tl-item::before{content:"";position:absolute;left:16px;top:40px;bottom:-8px;width:2px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-time{width:44px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;color:var(--text2);padding-top:4px;}
.tl-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:#fff;box-shadow:var(--shadow);}
.tl-body{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;}
.tl-body .t{font-size:14px;font-weight:700;}
.tl-body .s{font-size:12px;color:var(--text2);margin-top:1px;}
.tl-body .tip{font-size:12px;color:var(--text2);margin-top:4px;background:#f6f6f8;border-radius:8px;padding:5px 8px;}
.tl-links{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.tl-links a{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:980px;padding:2px 9px;background:#fff;}
.tl-links a.resv{border-color:#ffd9a0;background:#fff7e8;color:#b35c00;}

/* transit */
.transit{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;}
.transit h3{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.transit .tseg{font-size:12.5px;padding:3px 0;color:var(--text);}
.transit .tseg b{color:var(--text);}

/* candidates */
.cand-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:640px){.cand-grid{grid-template-columns:1fr 1fr;}}
.cand-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;}
.cand-card .cic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:#fff;}
.cand-card .cbody{flex:1;min-width:0;}
.cand-card .ct{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cand-card .cnote{font-size:12px;color:var(--text2);margin-top:2px;}
.cand-card .clinks{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.cand-card .clinks a{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:980px;padding:2px 9px;background:#fff;}
.rating{font-size:11px;font-weight:700;color:#b35c00;background:#fff4e0;border-radius:980px;padding:1px 7px;}
.alt-tag{font-size:10px;font-weight:700;color:#5a6472;background:#eef2f7;border-radius:980px;padding:1px 7px;}

.section-title{font-size:13px;font-weight:800;color:var(--text2);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
.leaflet-container{font:inherit;}
.leaflet-popup-content{font-size:13px;line-height:1.4;}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c,#0a84ff);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.pin span{transform:rotate(45deg);font-size:13px;line-height:1;font-weight:800;}
.pin-w{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.pin-label{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:10px;font-weight:700;color:var(--text);white-space:nowrap;margin-top:2px;max-width:130px;overflow:hidden;text-overflow:ellipsis;}
.map-hint{font-size:11px;color:var(--text2);padding:5px 12px 7px;background:#fff;border-bottom:.5px solid var(--line);}
.leaflet-div-icon{background:transparent;border:none;}
/* ── 花费统计 ── */
.exp-rate{font-size:12.5px;color:var(--text2);margin:-4px 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.exp-rate input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
.exp-rate .hint{color:var(--text2);opacity:.8;}
.exp-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.exp-sum{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.exp-sum .k{font-size:12px;color:var(--text2);}
.exp-sum .v{font-size:20px;font-weight:800;margin:2px 0;}
.exp-sum.alt .v{color:var(--accent);}
.exp-sum.total{background:#eef4ff;border-color:#cfe0ff;}
.exp-sum .s{font-size:11px;color:var(--text2);}
.exp-per{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.exp-per-item{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
.exp-per-item .n{font-size:12px;font-weight:700;}
.exp-per-item b{font-size:16px;font-weight:800;}
.exp-per-item .s{font-size:10.5px;color:var(--text2);}
.exp-form{display:flex;flex-direction:column;gap:10px;}
.f-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.f-row .f-lbl{font-size:12px;font-weight:700;color:var(--text2);min-width:64px;}
.f-row input[type=text],.f-row input[type=number],.f-row select,.f-row input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;outline:none;}
.f-row input[type=text]{flex:1;min-width:180px;}
.f-row input[type=number]{width:110px;}
.f-row input[type=date]{width:150px;}
.f-row select{max-width:280px;}
.mchip2{border:1px solid var(--line);background:#fff;border-radius:980px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--text2);}
.mchip2.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn{border:1px solid var(--line);background:#fff;border-radius:980px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.mini{padding:3px 10px;font-size:11px;}
.btn.danger{color:var(--red);border-color:#ffd0cc;}
.btn.danger:hover{background:#fff0ef;}
.spacer{flex:1;}
.exp-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.exp-item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;}
.exp-item .ei-ic{width:34px;height:34px;border-radius:10px;background:#f0f0f3;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.exp-item .ei-body{flex:1;min-width:0;}
.exp-item .ei-t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.exp-item .ei-s{font-size:12px;color:var(--text2);margin-top:1px;}
.exp-item .ei-actions{display:flex;gap:6px;flex-shrink:0;}
.empty{font-size:13px;color:var(--text2);text-align:center;padding:22px 0 10px;}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:980px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center;}
#toast.show{opacity:1;}
@media (max-width:560px){ .exp-sum-grid{grid-template-columns:1fr 1fr;} .exp-sum:last-child{grid-column:1/-1;} }
/* ── 编辑功能 ── */
.ov-tools{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
.li-del{background:none;border:none;color:var(--red);font-size:14px;font-weight:800;margin-left:4px;cursor:pointer;padding:0 2px;}
.li-add{display:flex;gap:6px;align-items:center;margin-top:4px;list-style:none;}
.prep-col li.li-add::before,.buy-col li.li-add::before{content:none !important;}
.li-add input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;}
.edit-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;}
.tl-edit{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tl-edit-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;}
.tl-edit-form input[type=text]{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;}
.tl-edit-form select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;}
.picker-list{max-height:320px;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px;}
.picker-row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:.5px solid var(--line);}
.picker-row:last-child{border-bottom:none;}
.picker-row .pic{font-size:16px;}
.picker-row .pn{flex:1;font-size:13px;font-weight:600;}
.picker-row .pc{font-size:11px;color:var(--text2);}
#pickerSearch{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;}
/* ── 云端同步 ── */
#syncBtn{position:absolute;right:12px;top:calc(6px + var(--safe-top));border:1px solid var(--line);background:#fff;border-radius:980px;width:38px;height:38px;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
#syncBtn .dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#c7c7cc;border:1.5px solid #fff;}
#syncBtn .dot.ok{background:#34c759;}
#syncBtn .dot.syncing{background:#ff9f0a;}
#syncBtn .dot.error{background:#ff3b30;}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.sheet.open{display:flex;}
.sheet-card{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-bottom));max-height:80vh;overflow-y:auto;box-shadow:0 -6px 30px rgba(0,0,0,.18);}
@media (min-width:900px){ .sheet{align-items:center;} .sheet-card{border-radius:18px;} }
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px;font-weight:700;}
#syncClose{border:none;background:none;font-size:16px;color:var(--text2);padding:4px 8px;}
.sync-status{font-size:13px;color:var(--text2);}

<script type="application/json" id="app-data">__APP_DATA__</script>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("app-data").textContent);
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
var WEEK = ["日","一","二","三","四","五","六"];

var CAT = {};
DATA.categories.forEach(function(c){ CAT[c.id] = c; });
var ROLE = {};
DATA.roles.forEach(function(r){ ROLE[r.id] = r; });

var state = { module:"overview", dayId:null, mapHidden:false, userCollapsed:false, mapReady:false, provider:"amap" };

/* ---------- 工具 ---------- */
function todayStr(d){
  d = d || new Date();
  var p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function tripState(now){
  var start = new Date(2026,8,24);
  var day1 = new Date(2026,8,25);
  var end = new Date(2026,9,7,23,59,59);
  if (now < start){
    var ms = start - now;
    var days = Math.ceil(ms/86400000);
    var label = days > 1 ? "距出发还有 "+days+" 天" : (days === 1 ? "明天就要出发啦" : "今天出发");
    return { phase:"before", label:label, sub:"出发日 2026/9/24 · 上海 → 昆明（中转过夜）" };
  }
  if (now < day1) return { phase:"eve", label:"出发前夜 · 今晚飞昆明", sub:"明天 9/25 09:15 落地清迈，行程正式开始" };
  if (now <= end){
    var n = Math.floor((now - day1)/86400000) + 1;
    return { phase:"during", day:n, label:"旅行进行中 · 第 "+n+" 天 / 共 13 天", sub:"今天是 "+todayStr(now)+" · 9/25 起算第 1 天" };
  }
  return { phase:"done", label:"旅行结束 🎉", sub:"13 天悠闲之旅完成，整理照片与手信吧" };
}
function renderCountdown(){
  var t = tripState(new Date());
  $("#countdownLabel").textContent = t.label;
  $("#countdownSub").textContent = t.sub;
  var btn = $("#todayBtn");
  if (t.phase === "during"){
    btn.classList.remove("hidden");
    btn.textContent = "查看今天 · 第 "+t.day+" 天 →";
  } else {
    btn.classList.add("hidden");
  }
}

/* ---------- 导航 ---------- */
function navLinks(poi, withResv){
  var q = encodeURIComponent(poi.name_zh || poi.name);
  var links = [
    { label:"高德", href:"https://uri.amap.com/search?keyword="+q },
    { label:"Google", href: poi.mapUrl || ("https://www.google.com/maps/search/?api=1&query="+q) },
    { label:"Apple", href:"http://maps.apple.com/?q="+q }
  ];
  if (withResv && poi.reservation && poi.reservation.required){
    links.push({ label:"🔔 需预约", href:"", cls:"resv" });
  }
  return links.map(function(l){
    var cls = l.cls ? ' class="'+l.cls+'"' : "";
    var href = l.href || "javascript:void(0)";
    return '<a'+cls+' href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>';
  }).join("");
}
function poiCard(poi, opts){
  opts = opts || {};
  var cat = CAT[poi.category] || { icon:"📍", color:"#8e8e93", label:"" };
  var rating = poi.rating ? '<span class="rating">★ '+poi.rating+'</span>' : "";
  var resv = (poi.reservation && poi.reservation.required) ? '<span class="alt-tag">🔔 需预约</span>' : "";
  return '<div class="cand-card">' +
    '<div class="cic" style="background:'+cat.color+'">'+cat.icon+'</div>' +
    '<div class="cbody">' +
      '<div class="ct">'+esc(poi.name_zh||poi.name)+' '+rating+' '+resv+'</div>' +
      '<div class="cnote">'+esc(poi.note||"")+'</div>' +
      '<div class="clinks">'+navLinks(poi)+'</div>' +
    '</div></div>';
}

/* ---------- 总览 ---------- */
function renderOverview(){

  var hero = '' +

      '<div class="kick">2026 中秋国庆 · 清迈 + 丽贝岛</div>' +

  var prep = '' +

        renderListItems("mustBuy.seven", "") +

    '</div></div>';

  var route = '' +
    '<div class="card"><h2><span class="ic">🗺️</span>路线概览</h2>' +
    '<div class="section-desc">点击任意一天跳到计划详情</div>' +
    '<div class="route-grid">' +
    d.days.map(function(day){
      return '<button class="route-card" data-day="'+esc(day.id)+'">' +
        '<div class="rd"><span class="dnum" style="background:'+day.color+'">'+esc(day.short)+'</span>' +
        '<span class="ddate">'+esc(day.date)+' · '+esc(day.weekday)+'</span>' +
        (day.city ? '<span class="ddate">· '+esc(day.city)+'</span>' : "") + '</div>' +
        '<div class="rtitle">'+esc(day.title)+(day.edited?' ✏️':'')+'</div>' +
        '<div class="rsum">'+esc(day.summary)+'</div>' +
      '</button>';
    }).join("") + '</div></div>';

  var ovTools = '<div class="ov-tools">' +
    '<button class="btn mini'+(OVERVIEW_EDIT?' primary':'')+'" id="ovEditToggle">'+(OVERVIEW_EDIT?'✅ 完成':'✏️ 编辑清单')+'</button>' +
    (OVERVIEW_EDIT ? '<button class="btn mini danger" id="ovResetLists">🔄 恢复默认</button>' : '') +
  '</div>';
  $("#module-overview").innerHTML = hero + statChips + ovTools + prep + flights + lodgings + buy + route;
  renderCountdown();

/* ---------- 计划详情 ---------- */
function renderDayTabs(){
  $("#dayTabs").innerHTML = DATA.days.map(function(day){
    return '<button class="day-tab'+(state.dayId===day.id?' active':'')+'" data-id="'+esc(day.id)+'" title="'+esc(day.date+' '+day.weekday+' · '+day.title)+'">' +
      esc(day.label) + ' <span class="w">'+esc(day.weekday)+'</span>' + (day.edited?' ✏️':'') + '</button>';
  }).join("");
}
function renderDay(day){
  var head = '' +
    '<div class="day-head">' +
      '<div class="dline"><span class="dnum" style="background:'+day.color+'">'+esc(day.short)+'</span>' +
      '<span class="city">'+esc(day.date)+' · '+esc(day.weekday)+'</span>' +
      (day.city ? '<span class="city">· '+esc(day.city)+'</span>' : "") + '</div>' +
      '<h2>'+esc(day.title)+'</h2>' +
      '<div class="summary">'+esc(day.summary)+'</div>' +
    '</div>';

  var editBar = '<div class="edit-bar">' +
    '<button class="btn mini'+(EDIT_MODE?' primary':'')+'" id="editToggle">'+(EDIT_MODE?'✅ 完成':'✏️ 编辑')+'</button>' +
    (EDIT_MODE ? '<button class="btn mini" id="editAdd">➕ 添加地点</button>' +
      '<button class="btn mini" id="editUndo">↩️ 撤销</button>' +
      '<button class="btn mini danger" id="editReset">🔄 恢复默认</button>' : '') +
    (day.edited ? '<span class="badge todo">✏️ 已编辑</span>' : '') +
  '</div>';

  var reminders = "";
  if (day.reminders && day.reminders.length){
    reminders = '<div class="reminder-bar"><div class="rt">🔔 预约提醒</div>' +
      day.reminders.map(function(r){
        return '<div class="reminder-item"><span class="lbl">'+esc(r.label)+'</span><span class="due">'+esc(r.due)+'</span></div>' +
          (r.detail ? '<div class="reminder-item" style="padding-left:0"><span>'+esc(r.detail)+'</span></div>' : "");
      }).join("") + '</div>';
  }

  var tl = '<div class="timeline">' + day.stops.map(function(st, idx){
    var poi = st.poi;
    var meta = (ROLE[st.role] || CAT[poi.category] || { icon:"📍", color:"#8e8e93", label:"" });
    var resv = "";
    if (poi.reservation && poi.reservation.required){
      resv = '<div class="tip">🔔 需预约：'+esc(poi.reservation.method||"")+' · '+esc(poi.reservation.leadTime||"")+' · '+esc(poi.reservation.contact||"")+(poi.reservation.tip?" · "+esc(poi.reservation.tip):"")+'</div>';
    }
    var ctrl = "";
    if (EDIT_MODE){
      ctrl = '<div class="tl-edit">' +
        '<button class="btn mini" data-edit="up" title="上移">↑</button>' +
        '<button class="btn mini" data-edit="down" title="下移">↓</button>' +
        '<button class="btn mini" data-edit="time">🕐 时间/类型</button>' +
        '<button class="btn mini danger" data-edit="del">🗑 删除</button>' +
      '</div>';
      if (EDIT_TARGET === idx){
        ctrl += '<div class="tl-edit-form">' +
          '<input type="text" id="editTime" value="'+esc(st.time||"")+'" placeholder="时间，如 15:00">' +
          '<select id="editRole">' + roleOptions(st.role) + '</select>' +
          '<button class="btn mini primary" id="editSave">保存</button>' +
          '<button class="btn mini" id="editCancel">取消</button>' +
        '</div>';
      }
    }
    return '<div class="tl-item" data-idx="'+idx+'">' +
      '<div class="tl-time">'+esc(st.time||"—")+'</div>' +
      '<div class="tl-ic" style="background:'+meta.color+'">'+meta.icon+'</div>' +
      '<div class="tl-body">' +
        '<div class="t">'+esc(poi.name_zh||poi.name)+'</div>' +
        '<div class="s">'+esc(meta.label||"")+' · '+esc(poi.area||"")+'</div>' +
        (poi.tip ? '<div class="tip">'+esc(poi.tip)+'</div>' : "") +
        resv +
        '<div class="tl-links">'+navLinks(poi, true)+'</div>' +
        ctrl +
      '</div></div>';
  }).join("") + '</div>';

  var transit = "";
  if (day.transit && day.transit.length){
    transit = '<div class="transit"><h3>🚗 交通衔接</h3>' + day.transit.map(function(t){
      return '<div class="tseg">🚌 <b>'+esc(t.fromName)+'</b> → <b>'+esc(t.toName)+'</b> · '+esc(t.mode||"")+(t.minutes?' · 约 '+t.minutes+' 分钟':"")+'<br><span style="color:var(--text2)">'+esc(t.label||"")+'</span></div>';
    }).join("") + '</div>';
  }

  var cands = "";
  if (day.candidates && day.candidates.length){
    cands = '<div class="section-title">📍 备选 · 不占主路线</div><div class="cand-grid">' +
      day.candidates.map(function(poi){ return poiCard(poi); }).join("") + '</div>';
  }

  var picker = "";
  if (EDIT_PICKER){
    picker = '<div class="card"><h2><span class="ic">➕</span>添加地点（从已有地点池选择）</h2>' +
      '<input type="text" id="pickerSearch" placeholder="搜索地点（名称/分类）…">' +
      '<div class="picker-list" id="pickerList">' + pickerListHtml("") + '</div></div>';
  }

  $("#dayPanel").innerHTML = head + editBar + reminders + tl + transit + cands + picker;
}

function selectDay(id, fromUser){
  var day = DATA.days.filter(function(d){ return d.id === id; })[0];
  if (!day) return;
  state.dayId = id;
  $$(".day-tab").forEach(function(t){ t.classList.toggle("active", t.dataset.id === id); });
  renderDay(day);
  renderMapDay(day);
  if (fromUser && state.module !== "detail") setModule("detail");
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------- 底图切换（高德 / Google / OSM） ---------- */
var TILE_PROVIDERS = {
  amap: { name:"高德地图", subdomains:"1234", maxZoom:18, url:"https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", attribution:"© 高德地图" },
  amap_sat: { name:"高德卫星", subdomains:"1234", maxZoom:18, url:"https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", attribution:"© 高德地图" },
  google: { name:"Google 地图", subdomains:"0123", maxZoom:20, url:"https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", attribution:"© Google" },
  google_sat: { name:"Google 卫星", subdomains:"0123", maxZoom:20, url:"https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", attribution:"© Google" },
  osm: { name:"OSM", subdomains:"", maxZoom:19, url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", attribution:"© OpenStreetMap" }
};
var tileLayer = null;
function providerKey(){
  try { var k = localStorage.getItem("tripMapProvider"); if (TILE_PROVIDERS[k]) return k; } catch(e){}
  return "amap";
}
function renderMapTools(){
  $("#mapTools").innerHTML = Object.keys(TILE_PROVIDERS).map(function(k){
    return '<button class="mchip'+(k===state.provider?" active":"")+'" data-key="'+k+'">'+TILE_PROVIDERS[k].name+'</button>';
  }).join("");
}
function setTileProvider(key){
  if (!TILE_PROVIDERS[key]) return;
  state.provider = key;
  if (!map) return;
  if (tileLayer) map.removeLayer(tileLayer);
  var p = TILE_PROVIDERS[key];
  tileLayer = L.tileLayer(p.url, { subdomains: p.subdomains || "abc", maxZoom: p.maxZoom || 19, attribution: p.attribution }).addTo(map);
  $$("#mapTools .mchip").forEach(function(c){ c.classList.toggle("active", c.dataset.key === key); });
  try { localStorage.setItem("tripMapProvider", key); } catch(e){}
}

/* ---------- 地图 ---------- */
var map = null, layer = null;
function ensureMap(){
  if (map) return;
  map = L.map("map", { zoomControl: true });
  state.provider = providerKey();
  renderMapTools();
  setTileProvider(state.provider);
  map.setView([18.80, 98.97], 12);
  layer = L.layerGroup().addTo(map);
  state.mapReady = true;
}
function haversineKm(a, b){
  var R = 6371, d2r = Math.PI/180;
  var dLat = (b[0]-a[0])*d2r, dLng = (b[1]-a[1])*d2r;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a[0]*d2r)*Math.cos(b[0]*d2r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function renderMapDay(day){
  if (!map || !day) return;
  layer.clearLayers();
  var pts = [];
  day.stops.forEach(function(st, idx){
    var poi = st.poi;
    if (!poi || !poi.coords) return;
    var meta = ROLE[st.role] || CAT[poi.category] || { icon:"📍", color:"#8e8e93", label:"" };
    var n = idx + 1;
    var label = poi.name_zh || poi.name;
    var icon = L.divIcon({
      className: "", iconSize: [0,0], iconAnchor: [13, 26], popupAnchor: [0, -34],
      html: '<div class="pin-w"><div class="pin" style="--c:'+meta.color+'"><span>'+n+'</span></div>' +
            '<div class="pin-label">'+esc(label)+'</div></div>'
    });
    L.marker(poi.coords, { icon: icon })
      .addTo(layer)
      .bindPopup('<b>'+n+'. '+esc(label)+'</b><br>'+(st.time?esc(st.time)+' ':"")+esc(meta.label||""));
    pts.push({ c: poi.coords, n: n });
  });
  if (!pts.length) return;
  // 顺序连线：跳过跨城长距离段（如航班），避免一条直线跨过全国
  for (var i = 1; i < pts.length; i++){
    if (haversineKm(pts[i-1].c, pts[i].c) <= 60){
      L.polyline([pts[i-1].c, pts[i].c], { color: day.color, weight: 3, opacity: .85, dashArray: "6 8" }).addTo(layer);
    }
  }
  // 聚焦当日主要活动区：有跨城长段时聚焦最大连续簇
  var clusters = [], cur = [pts[0]];
  for (var j = 1; j < pts.length; j++){
    if (haversineKm(cur[cur.length-1].c, pts[j].c) > 60){ clusters.push(cur); cur = [pts[j]]; }
    else cur.push(pts[j]);
  }
  clusters.push(cur);
  var best = clusters[0];
  for (var k = 1; k < clusters.length; k++){ if (clusters[k].length > best.length) best = clusters[k]; }
  var view = best.map(function(p){ return p.c; });
  if (view.length > 1){ map.fitBounds(L.latLngBounds(view).pad(0.28)); }
  else if (view.length === 1){ map.setView(view[0], 14); }
  setTimeout(function(){ map.invalidateSize(); }, 60);
}

function importExpenses(file){

      var valid = d.items.filter(function(it){ return it && typeof it.name === "string" && Number(it.amount) > 0; });
      EXP.items = EXP.items.concat(valid);
      if (typeof d.rate === "number" && d.rate > 0) EXP.rate = d.rate;
      saveExpenses(); toast("已导入 "+valid.length+" 笔（合并）"); renderExpenses();
    } catch(e){ toast("导入失败：无法解析文件"); }
  };
  reader.readAsText(file);
}

/* ---------- 行程编辑 / 清单编辑 ---------- */
var ORIG_DAYS = null;
var PRISTINE_DAYS = null;
var POI_MAP = {};
var EDIT_MODE = false;
var EDIT_PICKER = false;
var EDIT_TARGET = null;
var OVERVIEW_EDIT = false;
function buildPoiMap(){
  POI_MAP = {};
  DATA.days.forEach(function(d){
    d.stops.forEach(function(st){ if (st.poi) POI_MAP[st.poiId] = st.poi; });
    (d.candidates||[]).forEach(function(p){ if (p) POI_MAP[p.id] = p; });
  });
}
function cloneDay(d){
  return { id:d.id, date:d.date, label:d.label, weekday:d.weekday, short:d.short, title:d.title, city:d.city, summary:d.summary, color:d.color,
    stops: d.stops.map(function(st){ return { poiId:st.poiId, time:st.time, role:st.role, order:st.order, poi:st.poi }; }),
    transit: (d.transit||[]).map(function(t){ return { fromPoiId:t.fromPoiId, toPoiId:t.toPoiId, mode:t.mode, minutes:t.minutes, label:t.label, fromName:t.fromName, toName:t.toName }; }),
    candidates: (d.candidates||[]).slice(), reminders: (d.reminders||[]).slice(), edited:false };
}
function loadOverrides(){ try { var raw = localStorage.getItem("tripOverrides"); if (raw){ var o = JSON.parse(raw); if (o && o.days) return o; } } catch(e){} return { days:{}, history:{} }; }
function saveOverrides(o){ try { localStorage.setItem("tripOverrides", JSON.stringify(o)); } catch(e){} markDirty(); }
function applyOverrides(){
  if (!PRISTINE_DAYS){ buildPoiMap(); PRISTINE_DAYS = DATA.days.map(cloneDay); }
  ORIG_DAYS = PRISTINE_DAYS;
  var ov = loadOverrides();
  DATA.days.forEach(function(d){
    var o = ov.days[d.id];
    if (!o || !Array.isArray(o.routeStops)) return;
    var stops = [];
    o.routeStops.forEach(function(rs){
      var poi = POI_MAP[rs.poiId];
      if (poi) stops.push({ poiId: rs.poiId, time: rs.time || "", role: rs.role || "landmark", order: rs.order != null ? rs.order : stops.length, poi: poi });
    });
    d.stops = stops;
    d.transit = Array.isArray(o.transitSegments) ? o.transitSegments : recomputeTransit(d);
    d.edited = true;
  });
}
function recomputeTransit(day){
  var orig = ORIG_DAYS ? ORIG_DAYS.filter(function(x){ return x.id === day.id; })[0] : null;
  var segs = [];
  for (var i = 1; i < day.stops.length; i++){
    var a = day.stops[i-1].poiId, b = day.stops[i].poiId;
    var found = null;
    if (orig){ found = orig.transit.filter(function(t){ return t.fromPoiId === a && t.toPoiId === b; })[0] || null; }
    if (found){ segs.push({ fromPoiId:a, toPoiId:b, mode:found.mode, minutes:found.minutes, label:found.label, fromName:(POI_MAP[a]||{}).name_zh || a, toName:(POI_MAP[b]||{}).name_zh || b }); }
    else { segs.push({ fromPoiId:a, toPoiId:b, mode:"Grab / 步行（待复核）", minutes:"", label:"已调整行程，请出发前复核这段交通", fromName:(POI_MAP[a]||{}).name_zh || a, toName:(POI_MAP[b]||{}).name_zh || b }); }
  }
  return segs;
}
function daySnapshot(day){
  return { routeStops: day.stops.map(function(st, idx){ return { poiId:st.poiId, time:st.time || "", role:st.role || "landmark", order:idx }; }), transitSegments: day.transit || [] };
}
function pushHistory(dayId, ov, beforeSnap){
  ov.history = ov.history || {};
  ov.history[dayId] = ov.history[dayId] || [];
  ov.history[dayId].push(JSON.stringify(beforeSnap));
  if (ov.history[dayId].length > 20) ov.history[dayId].shift();
}
function saveDayOverride(dayId, beforeSnap){
  var ov = loadOverrides();
  if (beforeSnap) pushHistory(dayId, ov, beforeSnap);
  var d = DATA.days.filter(function(x){ return x.id === dayId; })[0];
  if (!d) return;
  ov.days[dayId] = daySnapshot(d);
  d.edited = true;
  saveOverrides(ov);
}
function syncDayNumbers(day){ day.stops.forEach(function(st, idx){ st.order = idx; }); day.transit = recomputeTransit(day); }
function currentDay(){ return DATA.days.filter(function(d){ return d.id === state.dayId; })[0] || null; }
function refreshAfterEdit(){
  var day = currentDay(); if (!day) return;
  renderDay(day); renderMapDay(day); renderDayTabs();
  if (state.module === "overview") renderOverview();
}
function undoDayEdit(dayId){
  var ov = loadOverrides();
  var h = (ov.history || {})[dayId] || [];
  if (!h.length){ toast("没有可撤销的操作"); return; }
  var prev = JSON.parse(h.pop());
  var d = DATA.days.filter(function(x){ return x.id === dayId; })[0];
  if (!d) return;
  var stops = [];
  prev.routeStops.forEach(function(rs){
    var poi = POI_MAP[rs.poiId];
    if (poi) stops.push({ poiId:rs.poiId, time:rs.time || "", role:rs.role || "landmark", order:rs.order != null ? rs.order : stops.length, poi:poi });
  });
  d.stops = stops; d.transit = prev.transitSegments || recomputeTransit(d); d.edited = true;
  if (!(ov.history[dayId] && ov.history[dayId].length)){
    var orig = ORIG_DAYS.filter(function(x){ return x.id === dayId; })[0];
    if (orig){ d.stops = orig.stops.map(function(st){ return { poiId:st.poiId, time:st.time, role:st.role, order:st.order, poi:st.poi }; }); d.transit = orig.transit.map(function(t){ return { fromPoiId:t.fromPoiId, toPoiId:t.toPoiId, mode:t.mode, minutes:t.minutes, label:t.label, fromName:t.fromName, toName:t.toName }; }); d.edited = false; }
    delete ov.days[dayId]; delete ov.history[dayId];
  } else {
    ov.days[dayId] = prev;
  }
  saveOverrides(ov);
  toast("已撤销");
  refreshAfterEdit();
}
function resetDayEdit(dayId){
  var ov = loadOverrides();
  var d = DATA.days.filter(function(x){ return x.id === dayId; })[0];
  var orig = ORIG_DAYS.filter(function(x){ return x.id === dayId; })[0];
  if (d && orig){ d.stops = orig.stops.map(function(st){ return { poiId:st.poiId, time:st.time, role:st.role, order:st.order, poi:st.poi }; }); d.transit = orig.transit.map(function(t){ return { fromPoiId:t.fromPoiId, toPoiId:t.toPoiId, mode:t.mode, minutes:t.minutes, label:t.label, fromName:t.fromName, toName:t.toName }; }); d.edited = false; }
  delete ov.days[dayId]; delete ov.history[dayId];
  saveOverrides(ov);
  toast("已恢复默认行程");
  refreshAfterEdit();
}
function addStopToDay(poiId){
  var day = currentDay(); if (!day) return;
  var poi = POI_MAP[poiId]; if (!poi) return;
  var before = daySnapshot(day);
  day.stops.push({ poiId:poiId, time:"", role:"landmark", order:day.stops.length, poi:poi });
  syncDayNumbers(day); saveDayOverride(day.id, before);
  EDIT_PICKER = false; toast("已加入： " + (poi.name_zh || poi.name)); refreshAfterEdit();
}
function removeStopFromDay(idx){
  var day = currentDay(); if (!day) return;
  if (idx < 0 || idx >= day.stops.length) return;
  var before = daySnapshot(day);
  day.stops.splice(idx, 1); syncDayNumbers(day); saveDayOverride(day.id, before);
  toast("已删除该地点"); refreshAfterEdit();
}
function moveStop(idx, dir){
  var day = currentDay(); if (!day) return;
  var to = idx + dir; if (to < 0 || to >= day.stops.length) return;
  var before = daySnapshot(day);
  var arr = day.stops; var tmp = arr[idx]; arr[idx] = arr[to]; arr[to] = tmp;
  syncDayNumbers(day); saveDayOverride(day.id, before); refreshAfterEdit();
}
function applyStopEdit(idx){
  var day = currentDay(); if (!day) return;
  var st = day.stops[idx]; if (!st) return;
  var before = daySnapshot(day);
  var t = document.getElementById("editTime"); var r = document.getElementById("editRole");
  if (t) st.time = t.value.trim(); if (r) st.role = r.value || "landmark";
  syncDayNumbers(day); saveDayOverride(day.id, before);
  EDIT_TARGET = null; toast("已保存修改"); refreshAfterEdit();
}
function roleOptions(sel){
  return DATA.roles.map(function(r){ return '<option value="'+r.id+'"'+(r.id===sel?' selected':'')+'>'+r.icon+' '+r.label+'</option>'; }).join("");
}
function pickerListHtml(q){
  q = (q||"").trim().toLowerCase();
  var list = Object.keys(POI_MAP).map(function(id){ return POI_MAP[id]; });
  var filtered = list.filter(function(p){
    if (!q) return true;
    return (p.name_zh||"").toLowerCase().indexOf(q) >= 0 || (p.name||"").toLowerCase().indexOf(q) >= 0 || (p.category||"").toLowerCase().indexOf(q) >= 0;
  });
  if (filtered.length > 60) filtered = filtered.slice(0, 60);
  if (!filtered.length) return '<div class="empty">没有匹配的地点</div>';
  return filtered.map(function(p){
    var cat = CAT[p.category] || { icon:"📍", label:"" };
    return '<div class="picker-row"><span class="pic">'+cat.icon+'</span><span class="pn">'+esc(p.name_zh||p.name)+'</span><span class="pc">'+esc(cat.label||"")+'</span><button class="btn mini primary picker-add" data-poi="'+p.id+'">加入</button></div>';
  }).join("");
}
function loadListOverrides(){ try { var raw = localStorage.getItem("tripListOverrides"); if (raw){ var o = JSON.parse(raw); if (o) return o; } } catch(e){} return {}; }
function saveListOverrides(){ try { localStorage.setItem("tripListOverrides", JSON.stringify(LIST_OV)); } catch(e){} }
var LIST_OV = loadListOverrides();
function defaultList(key){
  var parts = key.split("."); var obj = DATA;
  for (var i = 0; i < parts.length; i++){ obj = obj[parts[i]]; }
  return Array.isArray(obj) ? obj : [];
}
function getList(key){ return LIST_OV[key] || defaultList(key); }
function setList(key, arr){ LIST_OV[key] = arr.slice(); saveListOverrides(); markDirty(); }
function renderListItems(key, cls){
  var items = getList(key);
  var html = items.map(function(x, i){
    return '<li class="'+cls+'">'+esc(x)+(OVERVIEW_EDIT ? ' <button class="li-del" data-list="'+key+'" data-idx="'+i+'" title="删除">✕</button>' : "")+'</li>';
  }).join("");
  if (OVERVIEW_EDIT){
    html += '<li class="li-add"><input type="text" data-addlist="'+key+'" placeholder="新增一项…" maxlength="40"><button class="btn mini" data-addbtn="'+key+'">＋ 添加</button></li>';
  }
  return html;
}

/* ---------- 云端同步（Firebase Realtime Database） ---------- */
var SYNC = { room:"", localUpdatedAt:0, lastSyncAt:0, status:"off", panel:false, _t:null };
var SEEDING = false;
var SYNC_DB = "https://qingmai-lipe-2026-default-rtdb.firebaseio.com";
function loadSyncMeta(){
  try { var m = JSON.parse(localStorage.getItem("tripSyncMeta") || "{}");
    if (m && typeof m === "object"){ SYNC.room = m.room || ""; SYNC.localUpdatedAt = m.localUpdatedAt || 0; SYNC.lastSyncAt = m.lastSyncAt || 0; }
  } catch(e){}
}
function saveSyncMeta(){ try { localStorage.setItem("tripSyncMeta", JSON.stringify({ room:SYNC.room, localUpdatedAt:SYNC.localUpdatedAt, lastSyncAt:SYNC.lastSyncAt })); } catch(e){} }
function markDirty(){ SYNC.localUpdatedAt = Date.now(); saveSyncMeta(); if (SYNC.room){ if (SYNC._t) clearTimeout(SYNC._t); SYNC._t = setTimeout(doSync, 1500); } }
function syncUrl(){ return SYNC_DB + "/rooms/" + encodeURIComponent(SYNC.room) + "/data.json"; }
function setSyncStatus(st){ SYNC.status = st; renderSyncStatus(); }
function renderSyncStatus(){
  var b = document.getElementById("syncBtn");
  if (b){ var dot = b.querySelector(".dot"); if (dot) dot.className = "dot " + SYNC.status; }
  var p = document.getElementById("syncStatus");
  if (p){
    var map = { "off":"尚未连接云端", "no-room":"未设置房间号", "syncing":"正在同步…", "ok":"已连接 · 上次同步 " + (SYNC.lastSyncAt ? new Date(SYNC.lastSyncAt).toLocaleTimeString("zh-CN", { hour:"2-digit", minute:"2-digit" }) : "—"), "error":"同步失败（请检查网络/规则）" };
    p.textContent = map[SYNC.status] || "—";
  }
}
var DOT = String.fromCharCode(46); var TIL = String.fromCharCode(126); function encodeListKeys(o){ var r = {}; Object.keys(o || {}).forEach(function(k){ r[k.split(DOT).join(TIL)] = o[k]; }); return r; }
function decodeListKeys(o){ var r = {}; Object.keys(o || {}).forEach(function(k){ r[k.split(TIL).join(DOT)] = o[k]; }); return r; }
function buildLocalBlob(){
  var ov = loadOverrides();
  var expRaw = {};
  try { expRaw = JSON.parse(localStorage.getItem("tripExpenses") || "{}"); } catch(e){}
  return { v:1, updatedAt: Math.max(SYNC.localUpdatedAt, Date.now()), overrides:{ days: ov.days }, lists: encodeListKeys(LIST_OV), expenses: expRaw };
}
function pushLocal(){
  var blob = buildLocalBlob();
  SYNC.localUpdatedAt = blob.updatedAt; saveSyncMeta();
  return fetch(syncUrl(), { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(blob) })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); SYNC.lastSyncAt = Date.now(); saveSyncMeta(); setSyncStatus("ok"); renderSyncPanel(); })
    .catch(function(){ setSyncStatus("error"); });
}
function applyRemoteBlob(blob){
  if (!blob) return;
  if (blob.overrides && blob.overrides.days){ localStorage.setItem("tripOverrides", JSON.stringify({ days: blob.overrides.days, history: {} })); }
  if (blob.lists){ localStorage.setItem("tripListOverrides", JSON.stringify(decodeListKeys(blob.lists))); }
  if (blob.expenses){ localStorage.setItem("tripExpenses", JSON.stringify(blob.expenses)); }
  EXP = { items: [], rate: 5 }; loadExpenses();
  LIST_OV = loadListOverrides();
  applyOverrides();
  renderExpenses(); renderOverview(); renderDayTabs();
  var day = currentDay(); if (day){ renderDay(day); renderMapDay(day); }
  toast("已同步云端数据");
}
function doSync(){
  if (!SYNC.room){ setSyncStatus("no-room"); return; }
  if (SYNC.status === "syncing") return;
  setSyncStatus("syncing");
  fetch(syncUrl()).then(function(r){ return r.json(); }).then(function(remote){
    if (remote == null){ return pushLocal(); }
    var rUpd = remote.updatedAt || 0;
    if (SYNC.localUpdatedAt > rUpd){ return pushLocal(); }
    if (rUpd > SYNC.localUpdatedAt){ applyRemoteBlob(remote); SYNC.localUpdatedAt = rUpd; }
    SYNC.lastSyncAt = Date.now(); saveSyncMeta(); setSyncStatus("ok"); renderSyncPanel();
  }).catch(function(){ setSyncStatus("error"); });
}
function renderSyncPanel(){
  var p = document.getElementById("syncPanelBody");
  if (!p) return;
  p.innerHTML = '' +
    '<div class="f-row"><span class="f-lbl">房间号</span>' +
      '<input type="text" id="syncRoom" value="'+esc(SYNC.room)+'" placeholder="三台手机填同一个房间号" maxlength="40">' +
      '<button class="btn mini" id="syncSaveRoom">保存</button>' +
      '<button class="btn mini" id="syncCopyRoom">复制</button>' +
    '</div>' +
    '<div class="f-row"><span class="f-lbl">状态</span><span id="syncStatus" class="sync-status">—</span></div>' +
    '<div class="f-row">' +
      '<button class="btn primary" id="syncNow">🔄 立即同步</button>' +
      '<button class="btn mini" id="syncGenRoom">🎲 生成新房间号</button>' +
    '</div>' +
    '<div class="sync-hint">三台手机填同一个房间号即互通：任一方修改行程/清单/花费，其他手机约 20 秒内自动更新；以最后修改为准。数据存 Firebase（公开规则 + 随机房间号），仅你们这个房间可读写。</div>';
  renderSyncStatus();
}
function openSyncPanel(){ SYNC.panel = true; renderSyncPanel(); var sh = document.getElementById("syncSheet"); if (sh) sh.classList.add("open"); }
function closeSyncPanel(){ SYNC.panel = false; var sh = document.getElementById("syncSheet"); if (sh) sh.classList.remove("open"); }
document.getElementById("syncBtn").addEventListener("click", function(){ if (SYNC.panel) closeSyncPanel(); else openSyncPanel(); });
document.getElementById("syncSheet").addEventListener("click", function(e){
  if (e.target.id === "syncSheet" || e.target.id === "syncClose"){ closeSyncPanel(); return; }
  var sv = e.target.closest("#syncSaveRoom");
  if (sv){ SYNC.room = (document.getElementById("syncRoom").value || "").trim(); saveSyncMeta(); closeSyncPanel(); toast("房间号已保存"); doSync(); return; }
  var cp = e.target.closest("#syncCopyRoom");
  if (cp){ if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SYNC.room).then(function(){ toast("已复制房间号"); }); } else { toast("请手动复制：" + SYNC.room); } return; }
  var gn = e.target.closest("#syncGenRoom");
  if (gn){ SYNC.room = "t" + Math.random().toString(36).slice(2, 8); saveSyncMeta(); renderSyncPanel(); toast("已生成新房间号"); return; }
  var now = e.target.closest("#syncNow");
  if (now){ doSync(); return; }
});

/* ---------- 事件 ---------- */
$$(".module-btn").forEach(function(b){
  b.addEventListener("click", function(){
    if (b.dataset.module === "overview") setModule("overview");
    else if (b.dataset.module === "detail") setModule("detail");
    else setModule("expenses");
  });
});
document.addEventListener("click", function(e){
  var rc = e.target.closest(".route-card");
  if (rc){ selectDay(rc.dataset.day, true); return; }
  var jb = e.target.closest(".module-jump");
  if (jb){ setModule(jb.dataset.go); return; }

  if (tj){
    var t = tripState(new Date());
    if (t.phase === "during"){
      var day = DATA.days.filter(function(d){ return d.date === todayStr(); })[0];
      if (day) selectDay(day.id, true);
    }
    return;
  }
});
$("#mapToggle").addEventListener("click", function(){
  state.userCollapsed = !state.mapHidden;
  setMapHidden(state.userCollapsed);
});
$("#mapShowBtn").addEventListener("click", function(){
  state.userCollapsed = false;
  setMapHidden(false);
});
$("#mapTools").addEventListener("click", function(e){
  var c = e.target.closest(".mchip");
  if (c) setTileProvider(c.dataset.key);
});
$("#module-expenses").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var row = e.target.closest(".exp-item"); if (!row) return;
  if (b.dataset.act === "edit"){ EXP_EDIT_ID = row.dataset.id; renderExpenses(); }
  else if (b.dataset.act === "del"){ EXP.items = EXP.items.filter(function(it){ return it.id !== row.dataset.id; }); saveExpenses(); toast("已删除"); renderExpenses(); }
});
$("#dayPanel").addEventListener("click", function(e){
  var t = e.target.closest("#editToggle");
  if (t){ EDIT_MODE = !EDIT_MODE; EDIT_TARGET = null; EDIT_PICKER = false; refreshAfterEdit(); return; }
  var a = e.target.closest("#editAdd");
  if (a){ EDIT_PICKER = !EDIT_PICKER; refreshAfterEdit(); return; }
  var u = e.target.closest("#editUndo");
  if (u){ undoDayEdit(state.dayId); return; }
  var r = e.target.closest("#editReset");
  if (r){ resetDayEdit(state.dayId); return; }
  var pa = e.target.closest(".picker-add");
  if (pa){ addStopToDay(pa.dataset.poi); return; }
  var sv = e.target.closest("#editSave");
  if (sv && EDIT_TARGET != null){ applyStopEdit(EDIT_TARGET); return; }
  var cc = e.target.closest("#editCancel");
  if (cc){ EDIT_TARGET = null; refreshAfterEdit(); return; }
  if (EDIT_MODE){
    var item = e.target.closest(".tl-item");
    if (item){
      var idx = parseInt(item.dataset.idx, 10);
      var b2 = e.target.closest("[data-edit]");
      if (b2){
        var act = b2.dataset.edit;
        if (act === "up") moveStop(idx, -1);
        else if (act === "down") moveStop(idx, 1);
        else if (act === "del") removeStopFromDay(idx);
        else if (act === "time"){ EDIT_TARGET = (EDIT_TARGET === idx ? null : idx); refreshAfterEdit(); }
        return;
      }
    }
  }
});
$("#dayPanel").addEventListener("input", function(e){
  if (e.target && e.target.id === "pickerSearch"){
    var pl = document.getElementById("pickerList");
    if (pl) pl.innerHTML = pickerListHtml(e.target.value);
  }
});
$("#module-overview").addEventListener("click", function(e){
  var tg = e.target.closest("#ovEditToggle");
  if (tg){ OVERVIEW_EDIT = !OVERVIEW_EDIT; renderOverview(); return; }
  var rs = e.target.closest("#ovResetLists");
  if (rs){ LIST_OV = {}; saveListOverrides(); OVERVIEW_EDIT = false; toast("已恢复默认清单"); renderOverview(); return; }
  var del = e.target.closest(".li-del");
  if (del){ var key = del.dataset.list; var idx = parseInt(del.dataset.idx, 10); var arr = getList(key).slice(); arr.splice(idx, 1); setList(key, arr); renderOverview(); return; }
  var add = e.target.closest("[data-addbtn]");
  if (add){ var key2 = add.dataset.addbtn; var inp = add.closest(".li-add").querySelector("input"); var v = (inp.value||"").trim(); if (v){ var arr2 = getList(key2).slice(); arr2.push(v); setList(key2, arr2); renderOverview(); } return; }
});
$("#module-overview").addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.dataset && e.target.dataset.addlist){
    var key = e.target.dataset.addlist; var v = (e.target.value||"").trim();
    if (v){ var arr = getList(key).slice(); arr.push(v); setList(key, arr); renderOverview(); }
  }
});
$("#dayTabs").addEventListener("click", function(e){
  var t = e.target.closest(".day-tab");
  if (t) selectDay(t.dataset.id, true);
});
window.addEventListener("resize", function(){
  if (map) setTimeout(function(){ map.invalidateSize(); }, 120);
});

loadSyncMeta();
applyOverrides();
seedExpensesIfEmpty();
loadExpenses();
renderExpenses();
renderOverview();
renderDayTabs();
var initial = null;
var t = tripState(new Date());
if (t.phase === "during"){
  var today = DATA.days.filter(function(d){ return d.date === todayStr(); })[0];
  if (today) initial = today.id;
}
if (!initial) initial = DATA.days[1] ? DATA.days[1].id : DATA.days[0].id;
selectDay(initial, false);
setModule("overview");
setInterval(renderCountdown, 60000);
renderSyncStatus();
if (SYNC.room){ setTimeout(doSync, 800); }
setInterval(doSync, 20000);
window.addEventListener("focus", function(){ doSync(); });
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") doSync(); });
})();
